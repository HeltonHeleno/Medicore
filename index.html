<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel de operações hospitalares MediCore" />
    <meta name="theme-color" content="#0F3D36" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Aplica o tema salvo antes da renderização, evitando o "piscar" do tema claro -->
    <script>
      try {
        var tema = localStorage.getItem('medicore-tema');
        if (tema === 'dark' || tema === 'light') {
          document.documentElement.dataset.theme = tema;
        }
      } catch (e) {}
    </script>

    <title>MediCore — Painel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[build]
  command = "npm run build"
  publish = "dist"

# SPA: todas as rotas caem no index.html (React Router cuida do resto)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
